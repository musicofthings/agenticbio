# Local-only overlay (Docker Compose merges this automatically).
# Publishes host ports and adds Mailpit so signup/invite mail is visible
# at http://localhost:8025 without a real SMTP provider.
#
# Production later: do not copy this file to the server.
# Use ./scripts/prod-up.sh (docker-compose.yml + docker-compose.prod.yml).

services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: cio-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    environment:
      # ClassroomIO/nodemailer issues STARTTLS; Mailpit only implements it with a cert.
      MP_SMTP_TLS_CERT: /certs/cert.pem
      MP_SMTP_TLS_KEY: /certs/key.pem
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    volumes:
      - ./mailpit-certs:/certs:ro

  postgres:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  minio:
    ports:
      - "9000:9000"
      - "9001:9001"

  api:
    ports:
      - "3081:3081"
    environment:
      # Trust the local Mailpit self-signed STARTTLS cert (local only).
      NODE_EXTRA_CA_CERTS: /mailpit-certs/cert.pem
    volumes:
      - ./mailpit-certs/cert.pem:/mailpit-certs/cert.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  dashboard:
    ports:
      - "3082:3082"

  jobs:
    environment:
      NODE_EXTRA_CA_CERTS: /mailpit-certs/cert.pem
    volumes:
      - ./mailpit-certs/cert.pem:/mailpit-certs/cert.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
