# Production overlay for learn.agenticbio.in.
#
# Do NOT combine this file with docker-compose.override.yml (Mailpit + host ports).
# Explicit -f lists skip the auto-merged override. Prefer:
#
#   ./scripts/prod-up.sh
#
# Equivalent:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     --env-file .env.production up -d
#
# Cloudflare Zero Trust public hostname (token tunnel, configured in the dashboard):
#   Hostname: learn.agenticbio.in
#   Service:  http://dashboard:3082
# Optional media route on the same hostname:
#   Path /media*  ->  http://minio:9000
#
# Never put Cloudflare Access OTP in front of learn.agenticbio.in.

services:
  cloudflared:
    image: cloudflare/cloudflared:${CLOUDFLARED_VERSION:-2026.8.2}
    container_name: cio-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env.production}
    depends_on:
      dashboard:
        condition: service_started
